apiVersion: v1
kind: Service
metadata:
  name: exercise-2-web
  labels:
    app: exercise-2-web
spec:
  selector:
    app: exercise-2-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: exercise-2-api
  labels:
    app: exercise-2-api
spec:
  selector:
    app: exercise-2-api
  ports:
    - port: 8000
      targetPort: 8000
